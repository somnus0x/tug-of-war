name: Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    concurrency:
      group: web-build-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/tug-of-war/' }}
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID || '97' }}
          VITE_RPC_URLS: ${{ vars.VITE_RPC_URLS || 'https://bsc-testnet-rpc.publicnode.com,https://bsc-testnet.drpc.org,https://data-seed-prebsc-1-s1.bnbchain.org:8545,https://data-seed-prebsc-2-s1.bnbchain.org:8545' }}
          VITE_TUG_FACTORY: ${{ vars.VITE_TUG_FACTORY || '0xbFc1ccCB2D6a611219D387eC9A67a9DCF10C5431' }}
          VITE_WC_PROJECT_ID: ${{ vars.VITE_WC_PROJECT_ID || 'replace-with-reown-project-id' }}
          VITE_FIXTURES: ${{ vars.VITE_FIXTURES || '0' }}

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
